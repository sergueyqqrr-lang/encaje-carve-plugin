name: Build VST3 (Windows)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v4

      - name: Configure (CMake + Ninja + FetchContent JUCE)
        run: cmake -B build -G "Ninja Multi-Config"

      - name: Build (Release)
        run: cmake --build build --config Release --target EncajeCarve_VST3 --parallel

      - name: List built VST3
        shell: cmd
        run: dir /s /b build\*.vst3

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: EncajeCarve-VST3-Windows
          path: |
            build/**/VST3/**
          if-no-files-found: error
